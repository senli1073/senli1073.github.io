<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="刘智的个人主页" />
    <meta name="author" content="EthanLiu-001" />
    <title id="title"></title>

    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />

    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- 网络字体：英文 Tinos（Times New Roman 的免费替代），中文 霞鹜文楷 -->
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/tinos@5/400.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/tinos@5/700.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet" />

    <!-- Core theme CSS (includes Bootstrap)-->
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />

    <!-- 自定义字体 + 手机端适配 -->
    <style>
        body, h1, h2, h3, h4, h5, h6, p, a, li, span, div, td, th, strong, em,
        nav, footer, .navbar-brand, .nav-link, .font-alt, .display-3 {
            font-family: "Times New Roman", Times, "Tinos",
                         "KaiTi", "楷体", "STKaiti", "Kaiti SC", "LXGW WenKai",
                         serif !important;
        }

        /* 防止长文本撑出横向滚动条 */
        html, body {
            overflow-x: hidden;
        }
        main p, main li, main a {
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        /* 以下只在手机（屏幕宽度 ≤ 576px）上生效 */
        @media (max-width: 576px) {
            .container.px-5 {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
            #top-section-bg-text {
                font-size: 1.8rem !important;
                line-height: 1.4 !important;
            }
            .navbar-brand {
                font-size: 1.15rem !important;
            }
            #avatar img {
                max-width: 40vw !important;
                height: auto !important;
            }
            main {
                font-size: 15px;
                line-height: 1.75;
            }
            main h2 {
                font-size: 1.5rem !important;
            }
            main h4 {
                font-size: 1.1rem !important;
                margin-top: 1.2rem;
            }
            main ul, main ol {
                padding-left: 1.2rem;
            }
        }
    </style>

    <!-- Bootstrap core JS-->
    <script type="text/javascript" src="static/js/bootstrap.bundle.min.js"></script>

    <!-- Markdown -->
    <script type="text/javascript" src="static/js/marked.min.js"></script>

    <!-- Mathematics -->
    <script>
        // See https://docs.mathjax.org/en/latest/index.html for more details.
        MathJax = {
            tex: {
                packages: {},
                inlineMath: [
                    ['$', '$'],
                    ['\\(', '\\)']
                ],
                displayMath: [
                    ['$$', '$$'],
                    ['\\[', '\\]']
                ],
                processEscapes: false,
                processEnvironments: true,
                processRefs: true,
                digits: /^(?:[0-9]+(?:\{,\}[0-9]{3})*(?:\.[0-9]*)?|\.[0-9]+)/,
                tags: 'all',
                tagSide: 'right',
                tagIndent: '0.8em',
                useLabelIds: true,
                maxMacros: 10000,
                maxBuffer: 5 * 1024,
                formatError:
                    (jax, err) => jax.formatError(err)
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <!-- Core JS-->
    <script type="text/javascript" src="static/js/scripts.js"></script>
    <script type="text/javascript" src="static/js/js-yaml.min.js"></script>

</head>

<body id="page-top" class="site-loading">
    <div id="page-skeleton" class="page-skeleton" aria-hidden="true">
        <div class="skeleton-section skeleton-section-light">
            <div class="container px-5">
                <div class="skeleton-block skeleton-section-title"></div>
                <div class="skeleton-block skeleton-line skeleton-line-long"></div>
                <div class="skeleton-block skeleton-line"></div>
                <div class="skeleton-block skeleton-line skeleton-line-short"></div>
            </div>
        </div>
        <div class="skeleton-section skeleton-section-gray">
            <div class="container px-5">
                <div class="skeleton-block skeleton-section-title"></div>
                <div class="skeleton-block skeleton-line skeleton-line-long"></div>
                <div class="skeleton-block skeleton-line"></div>
                <div class="skeleton-block skeleton-line skeleton-line-short"></div>
            </div>
        </div>
    </div>

    <!-- Navigation-->
    <nav class="header navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="mainNav">
        <div class="container px-5">
            <a id="page-top-title" class="navbar-brand fw-bold" href="#page-top">&nbsp;</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                菜单
                <i class="bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul id="navbar-items" class="navbar-nav ms-auto me-4 my-3 my-lg-0"></ul>
            </div>
        </div>
    </nav>

    <!-- Top Section -->
    <section class="top-section" id="top-section">
        <div class="top-section-bg top-section-bg-active" aria-hidden="true"></div>
        <div class="top-section-bg" aria-hidden="true"></div>
        <div class="top-section-content">
            <div class="container px-5">
                <h2 id="top-section-bg-text" class="text-white display-3 lh-1 font-alt"></h2>
            </div>
        </div>
    </section>
    <!-- Top Section -->

    <!-- Photo -->
    <div class="container px-5">
        <div id="avatar">
            <img class="shadow" src="static/assets/img/photo.jpeg" alt="头像">
        </div>
    </div>
    <!-- Photo -->

    <main id="sections"></main>

    <!-- Footer-->
    <footer class="bg-bottom text-center py-5">
        <div class="container px-5">
            <div class="text-white-50 small">
                <div id="copyright-text" class="mb-2"></div>
                <a id="github-link" href="https://github.com/EthanLiu-001">Github</a>
                <span class="mx-1">&middot;</span>
                <a id="license-link" href="https://github.com/EthanLiu-001/EthanLiu-001.github.io/blob/main/LICENSE">License</a>
            </div>
        </div>
    </footer>

</body>

</html>
